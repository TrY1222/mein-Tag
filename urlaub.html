<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Urlaub</title>
<meta name="description" content="Urlaubskosten in jeder Währung eintragen – mit Tagesschnitt und Umrechner.">
<link rel="manifest" href="urlaub.webmanifest">
<link rel="apple-touch-icon" href="apple-urlaub.png">
<link rel="icon" type="image/png" href="icon-urlaub.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Urlaub">
<link rel="stylesheet" href="tw.css">
<style>
  :root { --accent: #0a8f8a; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #2fd1c6; --on-accent: #000000; } }
  :root[data-theme="dark"] { --accent: #2fd1c6; --on-accent: #000000; }
  .sum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; }
  .sum .big { grid-column: 1 / -1; padding-bottom: 6px; }
  .sum .big b { display: block; font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .sum b { display: block; font-size: 18px; font-weight: 700; }
  .sum span { font-size: 13px; color: var(--muted); }
  .budget { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
  .budget b { color: var(--fg); }
  .budget .over { color: var(--danger); }
  .bar-wrap { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; margin-top: 8px; }
  .bar-wrap i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .amount-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .amount-row input { flex: 1; min-width: 0; border: none; outline: none; background: var(--soft); border-radius: 14px; padding: 12px 16px; font-size: 28px; font-weight: 700; }
  .amount-row input::placeholder { color: var(--muted); font-weight: 600; }
  .cur-btn { flex-shrink: 0; min-width: 76px; height: 60px; border-radius: 14px; background: var(--soft); font-size: 17px; font-weight: 800; padding: 0 12px; }
  .conv { font-size: 14px; color: var(--muted); margin: 6px 4px 0; min-height: 20px; }
  .note-in { width: 100%; border: none; outline: none; background: none; border-bottom: 1px solid var(--line); padding: 10px 4px; font-size: 16px; margin-top: 2px; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .cats button { background: var(--soft); border-radius: 14px; padding: 10px 2px 8px; font-size: 12px; font-weight: 600; color: var(--fg); display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1.5px solid transparent; }
  .cats button .e { font-size: 24px; line-height: 1.1; }
  .cats button.on { border-color: var(--accent); }
  .cats button:active { transform: scale(.95); }
  .day-h { display: flex; justify-content: space-between; align-items: baseline; }
  .sp-e { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .sp-r { text-align: right; flex-shrink: 0; }
  .sp-r b { display: block; font-size: 17px; font-weight: 700; }
  .sp-r span { font-size: 13px; color: var(--muted); }
  .sp-r .warn { color: var(--danger); }
  .cat-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .top { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; }
  .cat-row .top b { font-weight: 700; }
  .cat-row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .cat-row .bar-wrap { background: var(--soft); }
  .rate-line { font-size: 13px; color: var(--muted); margin-top: 18px; text-align: center; line-height: 1.6; }
  .rate-line a { color: inherit; }
  .rate-line button { color: var(--accent); font-weight: 700; font-size: 13px; }
  .conv-list .tw-row { padding: 12px 0; }
  .conv-list .code { font-weight: 800; width: 52px; flex-shrink: 0; }
  .conv-list .name { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-list .val { font-weight: 700; font-size: 17px; text-align: right; }
  .cur-list { list-style: none; max-height: 52dvh; overflow-y: auto; margin-top: 10px; }
  .cur-list li { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cur-list li b { width: 48px; }
  .cur-list li span { color: var(--muted); font-size: 15px; flex: 1; }
  .cur-list li.on b { color: var(--accent); }
  .trip-row .tw-meta b { color: var(--accent); }
  .chip.date { position: relative; overflow: hidden; flex-shrink: 0; }
  .chip.date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="tw-head">
    <div>
      <h1 id="title">Urlaub</h1>
      <p class="tw-sub" id="sub"></p>
    </div>
    <button class="tw-icon-btn" id="menu" aria-label="Menü"></button>
  </header>
  <nav class="tw-tabs" id="tabs" aria-label="Ansicht">
    <button data-tab="ausgaben" class="on">Ausgaben</button>
    <button data-tab="auswertung">Auswertung</button>
    <button data-tab="umrechner">Umrechner</button>
  </nav>
  <div id="view"></div>
</div>
<script src="tw.js"></script>
<script src="urlaub.js"></script>
</body>
</html>
