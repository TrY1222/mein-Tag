<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131210">
<title>Tagwerk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<style>
/* ============================================================
   MEIN TAG — Paper & Ink
   Warmes Tinten-Dunkel / Papier-Hell, Serifen-Akzente,
   Bottom-Sheets, Tages-Dashboard.
   ============================================================ */
:root {
  --bg: #131210;
  --surface: #1c1a17;
  --surface2: #262320;
  --border: #34302a;
  --hairline: #2b2823;
  --text: #f1eee6;
  --muted: #98917f;
  --faint: #6b6558;

  --todo: #8fc178;      /* Moos */
  --habit: #7aa5f0;     /* Kobalt */
  --avoid: #e8796a;     /* Ziegel */
  --sport: #e0a458;     /* Bernstein */
  --run: #52bfae;       /* Jade */
  --skill: #de8fbb;     /* Magenta */
  --media: #b394dd;     /* Flieder */

  --ink-on-accent: #16130d;
  --shadow: 0 10px 30px rgba(0,0,0,.4);
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
body.light {
  --bg: #f5f3ed;
  --surface: #fdfcf8;
  --surface2: #edeae1;
  --border: #ddd7c9;
  --hairline: #e6e1d5;
  --text: #23211b;
  --muted: #7d7666;
  --faint: #a9a291;

  --todo: #4c8040;
  --habit: #3061c9;
  --avoid: #bc4433;
  --sport: #a8721f;
  --run: #178272;
  --skill: #b04f8b;
  --media: #7752b3;

  --ink-on-accent: #fffdf6;
  --shadow: 0 10px 26px rgba(60,50,30,.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { color-scheme: dark; }
body.light { color-scheme: light; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.45;
  min-height: 100dvh;
  padding-bottom: calc(86px + env(safe-area-inset-bottom));
  transition: background .3s, color .3s;
}

/* ---------- Kopf ---------- */
header.top {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: max(22px, env(safe-area-inset-top)) 20px 4px;
}
.overline { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1.date {
  font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.12;
  letter-spacing: -.01em; margin-top: 2px;
}
h1.date em { font-style: normal; color: var(--muted); font-weight: 400; }
.gear {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  display: grid; place-items: center; cursor: pointer;
}
.gear svg { width: 19px; height: 19px; }

main { padding: 14px 18px 0; max-width: 640px; margin: 0 auto; }

.view { display: none; }
.view.visible { display: block; animation: viewIn .3s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Abschnitts-Titel ---------- */
.sect { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 12px; }
.sect:first-child { margin-top: 10px; }
.sect .tick { width: 7px; height: 7px; border-radius: 2px; transform: translateY(-1px); }
.sect h2 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); flex: 1; }
.sect .sect-act {
  border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--sans);
}

/* ---------- Karten & Zeilen ---------- */
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 18px; padding: 16px; margin-bottom: 10px;
}
.row {
  display: flex; align-items: center; gap: 13px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 16px; padding: 13px 15px; margin-bottom: 8px;
  position: relative; touch-action: pan-y;
  animation: rowIn .3s ease backwards;
}
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 16px; font-weight: 600; overflow-wrap: break-word; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
.row .s .prev { flex: 1 1 100%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.done .t { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }

.ring-check {
  width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border); background: transparent; color: var(--ink-on-accent);
  font-size: 15px; font-weight: 800; line-height: 1; cursor: pointer;
  display: grid; place-items: center; transition: background .18s, border-color .18s, transform .18s;
}
.ring-check.on { animation: pop .3s ease; }
@keyframes pop { 45% { transform: scale(1.22); } }

.overdue { color: var(--avoid); font-weight: 700; }
.chip-badge {
  font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
}

.empty-state {
  text-align: center; color: var(--faint); font-size: 14.5px; line-height: 1.6;
  padding: 34px 20px; border: 1px dashed var(--border); border-radius: 18px; margin-bottom: 10px;
}
.hint { font-size: 12.5px; color: var(--faint); margin: 2px 4px 12px; }

/* ---------- Segmente ---------- */
.seg { display: flex; gap: 4px; background: var(--surface2); border-radius: 12px; padding: 4px; margin: 6px 0 16px; }
.seg button {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 9px 2px; border-radius: 9px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  font-family: var(--sans); transition: background .2s, color .2s;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.seg button.on::after {
  content: ""; display: block; width: 16px; height: 3px; border-radius: 2px;
  margin: 3px auto 0; background: var(--seg-accent, var(--text));
}

/* ---------- Heute: Ring ---------- */
.today-hero { display: flex; align-items: center; gap: 20px; padding: 20px 18px; }
.ringwrap { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
.ringwrap svg { width: 108px; height: 108px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 9; }
.ring-fg {
  fill: none; stroke: var(--todo); stroke-width: 9; stroke-linecap: round;
  transition: stroke-dashoffset .7s cubic-bezier(.3,.9,.3,1), stroke .3s;
}
.ring-label {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--serif); font-size: 27px; font-weight: 600;
}
.ring-label small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
.today-hero .msg { flex: 1; }
.today-hero .msg .m1 { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.25; }
.today-hero .msg .m2 { font-size: 13.5px; color: var(--muted); margin-top: 5px; }

.shield-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.shield-strip::-webkit-scrollbar { display: none; }
.shield {
  flex-shrink: 0; display: flex; align-items: baseline; gap: 7px;
  border: 1px solid var(--hairline); background: var(--surface);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.shield b { font-family: var(--serif); font-size: 17px; color: var(--avoid); }
.shield span { font-size: 13px; color: var(--muted); max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.mini-ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mini-ex .me {
  font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
}
.mini-ex .me.on { background: color-mix(in srgb, var(--sport) 22%, transparent); color: var(--sport); }

/* ---------- Medien: Ordner-Kacheln ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  border: 1px solid var(--hairline); background: var(--surface); border-radius: 18px;
  padding: 16px 14px; text-align: left; cursor: pointer; font-family: var(--sans);
  animation: rowIn .3s ease backwards;
}
.tile .ic { font-size: 26px; }
.tile .n { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 8px; }
.tile .c { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.media-total { font-family: var(--serif); font-size: 17px; margin: 4px 2px 14px; color: var(--muted); }
.media-total b { color: var(--media); font-weight: 600; }
.back-row { border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 2px 2px 12px; font-family: var(--sans); }
.cat-title { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 2px 12px; }

/* Tier-Wertung (S–D) */
.tier-badge {
  min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  font-size: 14px; font-weight: 800; color: #16130d; font-family: var(--sans);
}
.tl-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 6px; border-bottom: 1px solid var(--hairline); border-radius: 12px; }
.tl-row:last-of-type { border-bottom: none; }
.tl-items { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; min-height: 27px; }
.tl-item {
  font-size: 13.5px; background: var(--surface2); border-radius: 8px; padding: 5px 11px;
  cursor: grab; user-select: none; -webkit-user-select: none;
}
.tl-empty { color: var(--faint); font-size: 13.5px; font-style: italic; padding-top: 4px; }
.tl-pool {
  display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 9px;
  border: 1px dashed var(--border); border-radius: 12px;
}
.tl-over { background: color-mix(in srgb, var(--media) 14%, transparent); }
.tl-dragging { opacity: .35; }
.tl-ghost {
  position: fixed; z-index: 300; pointer-events: none;
  transform: translate(-50%, -130%) rotate(2deg); box-shadow: var(--shadow);
}

/* Einklappbare Skills */
.skill-head { cursor: pointer; }
.skill-head .skill-chev { color: var(--faint); font-size: 18px; line-height: 1; transition: transform .25s; }
.skill-head.open .skill-chev { transform: rotate(90deg); }

/* ---------- Sport ---------- */
.ex-row .val {
  width: 74px; text-align: center; font-family: var(--serif); font-size: 19px; font-weight: 600;
  background: var(--surface2); border: 1px solid transparent; color: var(--text);
  border-radius: 11px; padding: 8px 4px; outline: none;
}
.ex-row .val:focus { border-color: var(--sport); }
.ex-row .unit { font-size: 12px; color: var(--faint); width: 32px; }
.ex-row .ring-check { pointer-events: none; }
.ex-row.done-ex .ring-check { background: var(--sport); border-color: var(--sport); }

.stat-grid { display: flex; gap: 9px; margin-bottom: 12px; }
.stat {
  flex: 1; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 13px 8px; text-align: center;
}
.stat .v { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.stat .l { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }

/* ---------- Knöpfe: drei Stufen, eine Höhe ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; min-height: 52px; border-radius: 14px; padding: 0 16px;
  font-family: var(--sans); font-size: 15.5px; font-weight: 700;
  border: 1px solid transparent; cursor: pointer;
  transition: transform .12s ease, background .2s;
}
.btn svg { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 2; }
.btn:active { transform: scale(.975); }
.btn-primary { background: var(--accent, var(--text)); color: var(--ink-on-accent); }
.btn-primary[disabled] { background: var(--surface2); color: var(--faint); cursor: default; }
.btn-primary[disabled]:active { transform: none; }
.btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-quiet {
  background: none; color: var(--muted); font-weight: 600; font-size: 14.5px;
  min-height: 44px; justify-content: space-between; padding: 0 4px;
}
.btn-quiet:active { transform: none; opacity: .6; }
.btn-row { display: flex; gap: 9px; margin-bottom: 10px; }
.btn-row .btn { width: auto; flex: 1; }
.btn + .btn, .btn-row + .btn { margin-top: 10px; }
.btn-row .btn + .btn { margin-top: 0; }   /* sonst wächst die ganze Reihe mit */

/* S–D zum Antippen im Eintrag */
.tier-row { display: flex; gap: 8px; }
.tier-row button {
  flex: 1; height: 48px; border-radius: 12px; border: 1px solid var(--hairline);
  background: var(--surface2); color: var(--muted);
  font-size: 17px; font-weight: 800; cursor: pointer; font-family: var(--sans);
  transition: background .15s, color .15s;
}
.tier-row button.on { color: #16130d; border-color: transparent; }

/* ---------- Tierlist: Blöcke zum Reinziehen ---------- */
.tl-row {
  display: flex; border-radius: 12px; overflow: hidden;
  margin-bottom: 6px; min-height: 60px;
}
.tl-lab {
  flex: 0 0 54px; display: grid; place-items: center;
  font-family: var(--serif); font-size: 24px; font-weight: 700; color: #17140f;
}
.tl-items {
  flex: 1; background: var(--surface); display: flex; flex-wrap: wrap;
  gap: 6px; align-items: center; padding: 9px 11px; min-width: 0;
}
.tl-item {
  font-size: 12.5px; font-weight: 600; background: var(--surface2);
  border-radius: 7px; padding: 6px 10px; cursor: grab;
  user-select: none; -webkit-user-select: none; touch-action: none;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-empty { font-size: 12.5px; color: var(--faint); font-style: italic; }
.tl-pool {
  display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; padding: 10px;
  border: 1px dashed var(--border); border-radius: 12px;
}
.tl-over { box-shadow: 0 0 0 2px var(--media) inset; }
.tl-dragging { opacity: .3; }
.tl-ghost {
  position: fixed; z-index: 300; pointer-events: none;
  transform: translate(-50%, -140%) rotate(2.5deg); box-shadow: var(--shadow);
}

/* ---------- Rückblick: Wochenstreifen ---------- */
.rev-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.rev-title { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.rev-nav {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--hairline);
  background: var(--surface); color: var(--muted); font-size: 17px; cursor: pointer;
  font-family: var(--sans); flex-shrink: 0;
}
.rev-nav[disabled] { opacity: .3; cursor: default; }
.rev-day {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 11px 13px; margin-bottom: 6px; min-height: 58px;
  animation: rowIn .28s ease backwards;
}
.rev-day.today { border-color: var(--text); }
.rev-day.future { opacity: .3; cursor: default; }
.rev-date { flex: 0 0 48px; display: flex; align-items: baseline; gap: 5px; }
.rev-dow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--faint); }
.rev-num { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.rev-body { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.rev-quiet { font-size: 13px; color: var(--faint); }
.pill {
  font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.pill.todo  { background: color-mix(in srgb, var(--todo) 18%, transparent);  color: var(--todo); }
.pill.habit { background: color-mix(in srgb, var(--habit) 18%, transparent); color: var(--habit); }
.pill.sport { background: color-mix(in srgb, var(--sport) 18%, transparent); color: var(--sport); }
.pill.run   { background: color-mix(in srgb, var(--run) 18%, transparent);   color: var(--run); }
.pill.note  { background: color-mix(in srgb, var(--media) 18%, transparent); color: var(--media); }

/* ---------- Sport-Woche ---------- */
.spw { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 6px 14px; margin-bottom: 12px; }
.spw-dow { display: flex; gap: 4px; justify-content: flex-end; padding: 8px 0 2px; }
.spw-dow span { width: 22px; text-align: center; font-size: 9.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; }
.spw-dow .spw-pad { flex: 1; }
.spw-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
.spw-row:last-child { border-bottom: none; }
.spw-name { flex: 1; font-size: 14.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spw-week { display: flex; gap: 4px; flex-shrink: 0; }
.spw-week i {
  width: 22px; height: 27px; border-radius: 6px; display: grid; place-items: center;
  background: var(--surface2); font-size: 10px; font-weight: 700; color: var(--faint);
  font-style: normal; font-family: var(--sans);
}
.spw-week i.on { background: var(--sport); color: var(--ink-on-accent); }
.spw-week i.rest { opacity: .32; }
.spw-week i.today { box-shadow: 0 0 0 1.5px var(--text); }
.spw-sum { flex: 0 0 42px; text-align: right; font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--sport); }

/* Kalender */

.step-row { cursor: pointer; }
.step-row .ring-check { pointer-events: none; }
.step-row.done .ring-check { background: var(--skill); border-color: var(--skill); }
.step-row.done .t { color: var(--faint); text-decoration: line-through; }

/* ---------- FAB & Tabbar ---------- */
#fab {
  position: fixed; right: 18px; bottom: calc(86px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--text); color: var(--bg); font-size: 26px; line-height: 1;
  box-shadow: var(--shadow); display: grid; place-items: center; z-index: 40;
  transition: transform .2s, opacity .2s;
}
#fab:active { transform: scale(.92); }
#fab.hide { opacity: 0; pointer-events: none; transform: scale(.6); }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; justify-content: space-around;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 1px solid var(--hairline);
}
nav.tabs button {
  flex: 1; border: none; background: none; cursor: pointer; color: var(--faint);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; font-family: var(--sans); padding: 4px 0;
  transition: color .2s;
}
nav.tabs button svg { width: 23px; height: 23px; stroke-width: 1.9; }
nav.tabs button.on[data-tab="heute"]  { color: var(--text); }
nav.tabs button.on[data-tab="todo"]   { color: var(--todo); }
nav.tabs button.on[data-tab="habits"] { color: var(--habit); }
nav.tabs button.on[data-tab="media"]  { color: var(--media); }
nav.tabs button.on[data-tab="sport"]  { color: var(--sport); }

/* ---------- Bottom-Sheet ---------- */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end;
  background: rgba(8,7,5,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: 0; transition: opacity .25s;
}
.sheet-backdrop.open { opacity: 1; }
.sheet {
  position: relative;
  width: 100%; max-width: 640px; margin: 0 auto; max-height: 88dvh; overflow-y: auto;
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px 20px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .32s cubic-bezier(.25,.9,.3,1);
}
.sheet-backdrop.open .sheet { transform: none; }
.grab-zone { padding: 6px 0 12px; margin: -4px 0 4px; cursor: grab; touch-action: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto; }
.sheet-x {
  position: absolute; top: 12px; right: 14px; z-index: 5;
  width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--surface2); color: var(--muted); font-size: 15px; line-height: 1;
  display: grid; place-items: center;
}
.sheet-x:active { background: var(--border); }
.sheet h3 { font-family: var(--serif); font-size: 23px; font-weight: 600; margin-bottom: 4px; }
.sheet .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.sheet label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; letter-spacing: .04em; text-transform: uppercase; }
.sheet input[type=text], .sheet input[type=password], .sheet select, .sheet textarea {
  width: 100%; background: var(--surface2); border: 1px solid transparent; color: var(--text);
  border-radius: 13px; padding: 13px 14px; font-size: 16px; font-family: var(--sans); outline: none;
  -webkit-appearance: none; appearance: none;
}
.sheet input:focus, .sheet select:focus, .sheet textarea:focus { border-color: var(--sheet-accent, var(--text)); }
.sheet textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.sheet-actions { display: flex; gap: 9px; margin-top: 22px; }
.sheet-actions button {
  border: none; border-radius: 13px; padding: 14px 16px; font-size: 15.5px; font-weight: 700;
  cursor: pointer; font-family: var(--sans);
}
.sheet-actions .primary { flex: 1; background: var(--sheet-accent, var(--text)); color: var(--ink-on-accent); }
.sheet-actions .quiet { background: var(--surface2); color: var(--muted); }
.sheet-actions .danger { background: none; border: 1px solid var(--border); color: var(--avoid); }
.sheet-actions button:disabled { opacity: .5; }

.pickers { display: flex; gap: 9px; }
.pick {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--surface2); border-radius: 13px; padding: 13px 8px;
  font-size: 14.5px; font-weight: 600; color: var(--muted);
}
.pick.set { color: var(--text); box-shadow: 0 0 0 1.5px var(--sheet-accent, var(--text)) inset; }
.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.pick input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

.answer { font-size: 15.5px; line-height: 1.65; white-space: pre-wrap; }
.answer.blank { color: var(--faint); font-style: italic; }
.meta-line { font-size: 12px; color: var(--faint); margin-top: 10px; }

.tip-card { border-left: 3px solid var(--media); background: var(--surface2); border-radius: 12px; padding: 12px 14px; margin-bottom: 9px; }
.tip-card .tt { font-size: 15px; font-weight: 700; }
.tip-card .ta { font-size: 13px; color: var(--muted); margin-top: 1px; }
.tip-card .tr { font-size: 13.5px; margin-top: 5px; color: var(--text); opacity: .85; }

.pp-card { border-left: 3px solid var(--sport); background: var(--surface2); border-radius: 12px; padding: 12px 14px; margin-bottom: 9px; }
.pp-card .pn { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.pp-card .pl { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.pp-up { color: var(--todo); font-weight: 700; } .pp-down { color: var(--avoid); font-weight: 700; }

.wd-row { display: flex; gap: 7px; }
.wd-row .wd {
  flex: 1; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: var(--sans);
}
.wd-row .wd.on { background: var(--sport); border-color: var(--sport); color: var(--ink-on-accent); }

.pace-live { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--run); margin-top: 14px; min-height: 24px; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 15px; }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: right; }

/* Erinnerungs-Stufen */
.lvl-list { display: flex; flex-direction: column; gap: 7px; }
.lvl {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  border: 1px solid var(--hairline); background: var(--surface2); color: var(--text);
  border-radius: 13px; padding: 12px 14px; cursor: pointer; font-family: var(--sans);
}
.lvl .dot-sel {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border); display: grid; place-items: center;
}
.lvl.on { border-color: var(--avoid); background: color-mix(in srgb, var(--avoid) 12%, transparent); }
.lvl.on .dot-sel { border-color: var(--avoid); }
.lvl.on .dot-sel::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--avoid); }
.lvl .n { display: block; font-size: 15px; font-weight: 700; }
.lvl .d { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; font-size: 15.5px; font-weight: 600; }
.switch { position: relative; width: 50px; height: 30px; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; z-index: 2; cursor: pointer; margin: 0; }
.switch .knob {
  position: absolute; inset: 0; border-radius: 999px; background: var(--surface2); transition: background .25s;
  border: 1px solid var(--border);
}
.switch .knob::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--text); transition: transform .25s;
}
.switch input:checked + .knob { background: var(--todo); border-color: var(--todo); }
.switch input:checked + .knob::after { transform: translateX(20px); background: var(--ink-on-accent); }

/* ---------- Vokabeln ---------- */
.vc-filter { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.vc-chip {
  background: var(--surface2); border: 1px solid var(--hairline); color: var(--muted);
  border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: var(--sans);
}
.vc-chip.on { background: var(--media); border-color: var(--media); color: var(--ink-on-accent); font-weight: 700; }
.tag-eng {
  font-size: 10.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px;
  border-radius: 5px; margin-left: 6px; vertical-align: 2px;
  background: color-mix(in srgb, var(--run) 20%, transparent); color: var(--run);
}
.k-tag {
  font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px; vertical-align: 4px; margin-left: 4px;
}
.k-eng { background: color-mix(in srgb, var(--run) 20%, transparent); color: var(--run); }
.k-de  { background: color-mix(in srgb, var(--sport) 20%, transparent); color: var(--sport); }
#tab-books li.reading, .row.reading { border-color: color-mix(in srgb, var(--media) 42%, transparent); }
.vc-word { font-size: 17px; font-weight: 700; }
.vc-trans { font-size: 14px; color: var(--muted); margin-top: 1px; }
.vc-box {
  flex-shrink: 0; font-family: var(--serif); font-size: 12px; font-weight: 600;
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface2); color: var(--muted);
}
.vc-box.ripe { background: color-mix(in srgb, var(--todo) 24%, transparent); color: var(--todo); }

/* Abfrage */
.quiz {
  position: fixed; inset: 0; z-index: 380; background: var(--bg);
  display: flex; flex-direction: column;
  padding: max(24px, env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
}
.quiz-top { display: flex; align-items: center; justify-content: space-between; }
.quiz-count { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.quiz-bar { height: 4px; border-radius: 2px; background: var(--surface2); margin-top: 12px; overflow: hidden; }
.quiz-bar span { display: block; height: 100%; background: var(--media); transition: width .3s; }
.quiz-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.quiz-w { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1.1; }
.quiz-src { font-size: 13px; color: var(--faint); }
.quiz-a { display: none; }
.quiz.open .quiz-a { display: block; animation: viewIn .25s ease; }
.quiz-t { font-size: 22px; font-weight: 700; color: var(--media); }
.quiz-m { font-size: 15px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.quiz-e { font-size: 14.5px; font-style: italic; color: var(--faint); margin-top: 12px; line-height: 1.5; }
.quiz-btns { display: flex; gap: 10px; }
.quiz-btns button {
  flex: 1; border: none; border-radius: 14px; padding: 17px 8px;
  font-size: 16px; font-weight: 800; cursor: pointer; font-family: var(--sans);
}
.quiz-reveal { background: var(--media); color: var(--ink-on-accent); }
.quiz-again { background: var(--surface2); color: var(--avoid); border: 1px solid var(--border) !important; }
.quiz-got { background: var(--todo); color: var(--ink-on-accent); }
.quiz-done { text-align: center; }
.quiz-done .qd-big { font-family: var(--serif); font-size: 34px; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="overline" id="greet"></div>
    <h1 class="date" id="big-date"></h1>
  </div>
  <button class="gear" id="btn-settings" title="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<script>
/* ================================================================
   Helfer
   ================================================================ */
const $ = id => document.getElementById(id);

/* Icons – überall dieselbe Strichstärke, statt Emoji in Knöpfen */
const ICO = {
  plus:   '<path d="M12 5v14M5 12h14"/>',
  chart:  '<path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/>',
  cal:    '<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  spark:  '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
  trophy: '<path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3M9 20h6M12 14v6"/>',
  camera: '<rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5l1.5-2h4l1.5 2"/>',
  play:   '<path d="M7 5l11 7-11 7z"/>',
  bell:   '<path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  wand:   '<path d="M15 4V2M15 10V8M12.5 6h-2M19.5 6h-2M4 20l9-9M13.5 4.5l1 1"/>',
  bulb:   '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .8 1.6V17h5.4v-1.5c0-.6.3-1.2.8-1.6A6 6 0 0012 3z"/>',
  book:   '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>'
};
function ico(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + (ICO[name] || "") + "</svg>";
}
function btnHTML(level, id, icon, label, opts = {}) {
  const cls = "btn btn-" + level;
  const style = opts.accent ? ' style="--accent:' + opts.accent + '"' : "";
  const dis = opts.disabled ? " disabled" : "";
  if (level === "quiet") return `<button class="${cls}" id="${id}"${dis}><span>${label}</span><span>›</span></button>`;
  return `<button class="${cls}" id="${id}"${style}${dis}>${icon ? ico(icon) : ""}<span>${label}</span></button>`;
}
function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayStr() { return isoDate(new Date()); }
function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return d + "." + m + "." + y;
}
const WD_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const MONTHS_SHORT = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
function fmtNice(iso) {
  const d = new Date(iso + "T00:00:00");
  return WD_SHORT[d.getDay()] + ", " + d.getDate() + ". " + MONTHS_SHORT[d.getMonth()];
}
function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }
function daysBetweenIso(a, b) {
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function addDaysIso(iso, n) {
  const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoDate(d);
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ================================================================
   Daten (voll kompatibel mit der bisherigen App)
   ================================================================ */
const STORE_KEY = "meinTagData";
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
const data = Object.assign(
  { todos: [], dailies: [], avoids: [], knows: [], books: [], mediaTips: {}, bookTips: null, sport: null, usage: { input: 0, output: 0, cost: 0 } },
  load()
);

// Handstand-Etappen (Standard-Skill, wird beim ersten Start in die Skill-Liste übernommen)
const DEFAULT_HANDSTAND_STEPS = [
  "Handgelenke aufwärmen & Hollow-Body-Hold 3×20 Sek.",
  "Pike Push-ups 3×8 – baut die Schulterkraft auf",
  "Wall Walk: mit den Füßen die Wand hochlaufen, 3×3",
  "Wandhandstand (Bauch zur Wand), 3×20 Sek. halten",
  "Wandhandstand (Rücken zur Wand), Balance suchen, 3×30 Sek.",
  "Kurz von der Wand lösen, frei halten 3–5 Sek.",
  "Freier Handstand 15+ Sek."
];

/* Karteikasten: Pause bis zur nächsten Abfrage, je Fach */
const VOCAB_BOXES = [1, 3, 7, 14, 30];

/* Eskalationsstufen der Erinnerungen */
const NAG_LEVELS = {
  sanft:     { label: "Sanft",     desc: "Ein Hinweis, alle 4 Stunden.",        everyMin: 240, max: 1, wall: false },
  normal:    { label: "Normal",    desc: "Alle 2 Stunden, freundlich.",          everyMin: 120, max: 2, wall: false },
  penetrant: { label: "Penetrant", desc: "Alle 30 Minuten. Mit Nachdruck.",      everyMin: 30,  max: 3, wall: true },
  gnadenlos: { label: "Gnadenlos", desc: "Alle 10 Minuten. Du hast es so gewollt.", everyMin: 10, max: 6, wall: true }
};

function normalizeData() {
  if (!data.usage) data.usage = { input: 0, output: 0, cost: 0 };
  if (!Array.isArray(data.todos)) data.todos = [];
  // Aufgaben: „bis wann" (until) oder „an diesem Tag" (on)
  data.todos.forEach(t => { if (t.kind !== "on") t.kind = "until"; });
  if (!Array.isArray(data.dailies)) data.dailies = [];
  // Gewohnheiten führen jetzt eine Liste erledigter Tage – für den Rückblick
  data.dailies.forEach(h => {
    if (!Array.isArray(h.history)) h.history = h.lastDone ? [h.lastDone] : [];
  });
  // Tagebuch: ein Text je Tag
  if (!data.journal || typeof data.journal !== "object") data.journal = {};
  if (!Array.isArray(data.avoids)) data.avoids = [];
  if (!Array.isArray(data.books)) data.books = [];
  if (!data.sport) data.sport = {};
  if (!Array.isArray(data.sport.trainingDays)) data.sport.trainingDays = [1, 2, 4, 5];
  if (!data.sport.log || typeof data.sport.log !== "object") data.sport.log = {};
  if (!Array.isArray(data.sport.runs)) data.sport.runs = [];
  if (!Array.isArray(data.sport.customEx)) data.sport.customEx = [];
  data.sport.customEx = data.sport.customEx.filter(e => e && e.name);
  if (!Array.isArray(data.sport.removedEx)) data.sport.removedEx = [];
  // Skills: alte Handstand-Struktur in die neue Skill-Liste überführen
  if (!Array.isArray(data.sport.skillList)) {
    const hs = (data.sport.skills && data.sport.skills.handstand) || { done: [] };
    data.sport.skillList = [{
      id: "handstand", name: "Handstand", emoji: "🤸",
      steps: DEFAULT_HANDSTAND_STEPS.slice(),
      done: Array.isArray(hs.done) ? hs.done.slice() : []
    }];
  }
  data.sport.skillList.forEach(sk => {
    if (!Array.isArray(sk.steps)) sk.steps = [];
    if (!Array.isArray(sk.done)) sk.done = [];
  });
  // Medien: Typ-Kennung + Sterne (1–5) in Tiers (S–D) überführen
  data.books.forEach(b => {
    if (!b.media) b.media = "book";
    if (typeof b.eng !== "boolean") b.eng = false;
    if (typeof b.reading !== "boolean") b.reading = false;
  });
  data.vocab.forEach(v => { if (v.kind !== "term") v.kind = "word"; });
  // Filme & Serien gibt es nicht mehr (läuft über Letterboxd)
  data.books = data.books.filter(b => b.media !== "screen");
  if (data.mediaTips && typeof data.mediaTips === "object") delete data.mediaTips.screen;
  const R2T = { 5: "S", 4: "A", 3: "B", 2: "C", 1: "D" };
  data.books.forEach(b => {
    if (!b.tier && b.rating) b.tier = R2T[b.rating] || "";
    delete b.rating;
  });
  if (!data.mediaTips || typeof data.mediaTips !== "object") data.mediaTips = {};
  if (data.bookTips && !data.mediaTips.book) { data.mediaTips.book = data.bookTips; data.bookTips = null; }
  // Erinnerungen
  if (!data.notify || typeof data.notify !== "object") data.notify = {};
  if (typeof data.notify.on !== "boolean") data.notify.on = false;
  if (!NAG_LEVELS[data.notify.level]) data.notify.level = "penetrant";
  if (typeof data.notify.night !== "boolean") data.notify.night = true;
  if (!data.notify.lastFire || typeof data.notify.lastFire !== "object") data.notify.lastFire = {};
  // Vokabeln
  if (!Array.isArray(data.vocab)) data.vocab = [];
  data.vocab.forEach(v => {
    if (typeof v.box !== "number" || v.box < 1) v.box = 1;
    if (v.box > VOCAB_BOXES.length) v.box = VOCAB_BOXES.length;
    if (!v.due) v.due = todayStr();
  });
}

/* ================================================================
   Bottom-Sheet
   ================================================================ */
function openSheet(html, { accent } = {}) {
  const backdrop = document.createElement("div");
  backdrop.className = "sheet-backdrop";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  if (accent) sheet.style.setProperty("--sheet-accent", accent);
  sheet.innerHTML = '<div class="grab-zone"><div class="grab"></div></div>'
    + '<button class="sheet-x" title="Schließen">✕</button>' + html;
  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => backdrop.classList.add("open"));

  const close = () => {
    sheet.style.transform = "";
    backdrop.style.opacity = "";
    backdrop.classList.remove("open");
    setTimeout(() => backdrop.remove(), 280);
  };
  backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });
  sheet.querySelector(".sheet-x").addEventListener("click", close);

  /* Runterwischen: greift von überall, solange das Fenster oben steht.
     Ein schneller Schnipser genügt – die Strecke ist zweitrangig. */
  const SPRING = "transform .42s cubic-bezier(.2,.9,.25,1)";
  let sy = 0, dy = 0, drag = false, pid = null, lastY = 0, lastT = 0, vel = 0;

  sheet.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const onGrab = !!e.target.closest(".grab-zone");
    // Eingabefelder und Textbereiche gehören dem Finger, nicht der Geste
    const onInput = !!e.target.closest("input, textarea, select");
    if (!onGrab && (sheet.scrollTop > 0 || onInput)) return;
    sy = lastY = e.clientY; lastT = e.timeStamp; dy = 0; vel = 0;
    drag = true; pid = e.pointerId;
    sheet.style.transition = "none";
  });

  sheet.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== pid) return;
    dy = e.clientY - sy;
    const dt = e.timeStamp - lastT;
    if (dt > 0) vel = (e.clientY - lastY) / dt;      // Pixel je Millisekunde
    lastY = e.clientY; lastT = e.timeStamp;
    if (dy > 3) { try { sheet.setPointerCapture(pid); } catch {} }
    const shown = dy < 0 ? dy / 4 : dy;              // Widerstand nach oben
    sheet.style.transform = "translateY(" + shown + "px)";
    if (dy > 0) backdrop.style.opacity = String(Math.max(0.12, 1 - dy / 460));
  });

  const endDrag = () => {
    if (!drag) return;
    drag = false;
    if (vel > 0.45 || dy > 110) { close(); return; }
    sheet.style.transition = SPRING;
    sheet.style.transform = "translateY(0)";
    backdrop.style.opacity = "";
  };
  sheet.addEventListener("pointerup", endDrag);
  sheet.addEventListener("pointercancel", endDrag);

  return { sheet, close };
}

/* ================================================================
   Wischgesten (rechts = Aktion, links = löschen)
   ================================================================ */
function enableSwipe(el, { onRight, onDelete }) {
  el.style.touchAction = "pan-y";
  let sx = 0, sy = 0, dx = 0, active = false, decided = false, horiz = false, pid = null, swiped = false;
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; dx = 0; active = true; decided = false; horiz = false; pid = e.pointerId;
    el.style.transition = "none";
  });
  el.addEventListener("pointermove", e => {
    if (!active || e.pointerId !== pid) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
      decided = true; horiz = Math.abs(mx) > Math.abs(my);
      if (horiz) { try { el.setPointerCapture(pid); } catch {} }
    }
    if (!horiz) return;
    dx = mx;
    el.style.transform = "translateX(" + dx + "px)";
    el.style.background = dx > 0 ? "rgba(143,193,120,.16)" : dx < 0 ? "rgba(232,121,106,.16)" : "";
  });
  const end = () => {
    if (!active) return; active = false;
    swiped = horiz && Math.abs(dx) > 10;
    el.style.transition = "transform .22s ease, background .22s ease, opacity .22s ease";
    const TH = 70;
    if (horiz && dx <= -TH && onDelete) {
      el.style.transform = "translateX(-110%)"; el.style.opacity = "0";
      setTimeout(onDelete, 200);
    } else {
      el.style.transform = ""; el.style.background = "";
      if (horiz && dx >= TH && onRight) onRight();
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("click", e => { if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; } }, true);
}

/* ================================================================
   Claude-API (eigener Schlüssel, nur lokal gespeichert)
   ================================================================ */
const KEY_STORE = "meinTagApiKey";
function getApiKey() { return localStorage.getItem(KEY_STORE) || ""; }

const PRICES = {
  "claude-opus-4-8":  { input: 5, output: 25, cacheWrite: 6.25, cacheRead: 0.5 },
  "claude-haiku-4-5": { input: 1, output: 5,  cacheWrite: 1.25, cacheRead: 0.1 }
};
function usdCost(u, model) {
  const p = PRICES[model] || PRICES["claude-haiku-4-5"];
  return (u.input_tokens || 0) * p.input / 1e6
       + (u.output_tokens || 0) * p.output / 1e6
       + (u.cache_creation_input_tokens || 0) * p.cacheWrite / 1e6
       + (u.cache_read_input_tokens || 0) * p.cacheRead / 1e6;
}
function fmtCost(c) { return "$" + c.toFixed(4); }

async function callClaude({ system, userText, maxTokens = 4096, tools = null, model = "claude-haiku-4-5", image = null }) {
  const apiKey = getApiKey();
  if (!apiKey) {
    alert("Bitte trage zuerst in den Einstellungen (Zahnrad oben rechts) deinen API-Schlüssel ein.");
    return null;
  }
  let content = userText;
  if (image) {
    content = [
      { type: "image", source: { type: "base64", media_type: image.mediaType, data: image.data } },
      { type: "text", text: userText }
    ];
  }
  const messages = [{ role: "user", content }];
  let cost = 0, tokIn = 0, tokOut = 0, response = null;
  for (let i = 0; i < 6; i++) {
    const reqBody = { model, max_tokens: maxTokens, system, messages };
    if (tools) reqBody.tools = tools;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(reqBody)
    });
    const body = await res.json();
    if (!res.ok) {
      if (res.status === 401) throw new Error("Der API-Schlüssel wurde nicht akzeptiert. Prüfe ihn in den Einstellungen.");
      throw new Error(body?.error?.message || res.statusText);
    }
    cost += usdCost(body.usage || {}, model);
    tokIn += body.usage?.input_tokens || 0;
    tokOut += body.usage?.output_tokens || 0;
    response = body;
    if (body.stop_reason === "pause_turn") {
      messages.push({ role: "assistant", content: body.content });
      continue;
    }
    break;
  }
  if (response.stop_reason === "refusal") throw new Error("Claude hat diese Anfrage abgelehnt.");
  const text = (response.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
  if (!text) throw new Error("Es kam keine Text-Antwort zurück. Versuche es noch einmal.");
  data.usage.cost += cost;
  data.usage.input += tokIn;
  data.usage.output += tokOut;
  save();
  return { text, cost };
}

/* ================================================================
   HEUTE — das Tages-Dashboard
   ================================================================ */
function habitState(h) {
  const today = todayStr();
  const interval = h.interval || 1;
  const gap = h.lastDone ? daysBetweenIso(h.lastDone, today) : Infinity;
  const alive = h.lastDone && gap <= interval;
  const doneToday = h.lastDone === today;
  const nextDue = h.lastDone ? addDaysIso(h.lastDone, interval) : today;
  const due = !doneToday && nextDue <= today;
  return { interval, doneToday, due, nextDue, streak: alive ? h.streak : 0 };
}
function toggleDailyHabit(h) {
  const today = todayStr();
  if (!Array.isArray(h.history)) h.history = [];
  if (h.lastDone === today) {
    h.streak = h.prevStreak;
    h.lastDone = h.prevLastDone;
    h.history = h.history.filter(d => d !== today);
  } else {
    h.prevStreak = h.streak;
    h.prevLastDone = h.lastDone;
    const g = h.lastDone ? daysBetweenIso(h.lastDone, today) : Infinity;
    h.streak = (h.lastDone && g <= (h.interval || 1)) ? h.streak + 1 : 1;
    h.lastDone = today;
    if (!h.history.includes(today)) h.history.push(today);
  }
  save(); rerenderAll();
}

/* Fällig heute? „until" = spätestens dann, „on" = genau dann. */
function todoDue(t, today) {
  if (t.done || !t.deadline) return false;
  return t.kind === "on" ? t.deadline <= today : t.deadline <= today;
}
function todoSoon(t, today) {
  if (t.done || !t.deadline || t.kind !== "on") return false;
  const d = daysBetweenIso(today, t.deadline);
  return d > 0 && d <= 2;
}
function markTodo(t, done) {
  t.done = done;
  if (done) t.doneAt = todayStr(); else delete t.doneAt;
}
function resetAvoid(a) {
  if (confirm("Rückfall bei „" + a.title + "“? Der Zähler startet neu bei 0.")) {
    a.since = Date.now(); save(); rerenderAll();
  }
}
function freqLabel(n) {
  if (n === 1) return "Täglich";
  if (n === 7) return "1x pro Woche";
  if (n === 14) return "Alle 2 Wochen";
  return "Alle " + n + " Tage";
}

  const planHabits = habitStates.filter(x => x.st.due || x.st.doneToday);

  const pct = total ? Math.round(done / total * 100) : 100;

  let msg;
  if (total === 0) msg = "Freier Tag – nichts ist fällig.";
  else if (done === total) msg = "Alles geschafft. Stark!";
  else if (done === 0) msg = total + (total === 1 ? " Punkt steht" : " Punkte stehen") + " heute an.";

let reviewWeek = 0;   // 0 = diese Woche, -1 = vorige …

function dayRecord(iso) {
  const todos = data.todos.filter(t => t.doneAt === iso);
  const habits = data.dailies.filter(h => (h.history || []).includes(iso));
  const ex = data.sport.log[iso] || {};
  const exList = allEx().filter(e => ex[e.name]).map(e => ({ name: e.name, val: ex[e.name], unit: e.unit }));
  const runs = data.sport.runs.filter(r => r.date === iso);
  const note = (data.journal[iso] || "").trim();
  return { todos, habits, exList, runs, note,
    any: todos.length || habits.length || exList.length || runs.length || note };
}

function renderReviewWeek(el) {
  const todayIso = todayStr();
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + reviewWeek * 7);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(isoDate(addD(mon, i)));

  const first = days[0], last = days[6];
  const label = reviewWeek === 0 ? "Diese Woche"
    : reviewWeek === -1 ? "Vorige Woche"
    : fmtShort(first) + " – " + fmtShort(last);

  el.innerHTML = `
    <div class="rev-head">
      <button class="rev-nav" data-nav="-1">‹</button>
      <span class="rev-title">${esc(label)}</span>
      <button class="rev-nav" data-nav="1" ${reviewWeek >= 0 ? "disabled" : ""}>›</button>
    </div>
    <div id="rev-days"></div>`;

  const list = el.querySelector("#rev-days");
  days.forEach((iso, i) => {
    const r = dayRecord(iso);
    const future = iso > todayIso;
    const d = new Date(iso + "T00:00:00");
    const row = document.createElement("div");
    row.className = "rev-day" + (iso === todayIso ? " today" : "") + (future ? " future" : "");
    row.style.animationDelay = (i * .03) + "s";

    // Klartext statt Farbcode
    const pills = [];
    if (r.todos.length) {
      pills.push(r.todos.length === 1
        ? '<span class="pill todo">' + esc(shorten(r.todos[0].title, 22)) + "</span>"
        : '<span class="pill todo">' + r.todos.length + " Aufgaben</span>");
    }
    r.habits.slice(0, 2).forEach(h => pills.push('<span class="pill habit">' + esc(shorten(h.title, 18)) + "</span>"));
    if (r.habits.length > 2) pills.push('<span class="pill habit">+' + (r.habits.length - 2) + "</span>");
    if (r.exList.length) {
      const top = r.exList[0];
      pills.push('<span class="pill sport">' + (r.exList.length === 1 ? top.val + " " + esc(top.name) : "Training") + "</span>");
    }
    r.runs.forEach(x => pills.push('<span class="pill run">' + x.km.toFixed(1).replace(".", ",") + " km</span>"));
    if (r.note) pills.push('<span class="pill note">Notiz</span>');

    const body = pills.length ? pills.join("")
      : future ? '<span class="rev-quiet">—</span>'
      : iso === todayIso ? '<span class="rev-quiet">Heute – noch nichts eingetragen</span>'
      : '<span class="rev-quiet">nichts</span>';

    row.innerHTML = `
      <span class="rev-date"><span class="rev-dow">${WD_SHORT[d.getDay()]}</span><span class="rev-num">${d.getDate()}</span></span>
      <span class="rev-body">${body}</span>`;
    if (!future) row.addEventListener("click", () => openReviewDay(iso));
    list.appendChild(row);
  });

  el.querySelectorAll(".rev-nav").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    reviewWeek += parseInt(b.dataset.nav, 10);
    if (reviewWeek > 0) reviewWeek = 0;
    renderReviewWeek(el);
  }));
}

function fmtShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.getDate() + ". " + MONTHS_SHORT[d.getMonth()];
}
function shorten(s, n) {
  s = String(s);
  // Autor abschneiden, Reihentitel auf den Haupttitel vor dem Doppelpunkt kürzen
  const cut = s.split(" – ")[0].split(": ")[0];
  if (cut.length <= n) return cut;
  // an der letzten Wortgrenze trennen, nicht mitten im Wort
  const head = cut.slice(0, n);
  const sp = head.lastIndexOf(" ");
  return (sp > n * 0.55 ? head.slice(0, sp) : head).trimEnd() + "…";
}

function renderTodos() {
  const box = $("view-todo");
  box.innerHTML = "";
  const open = data.todos.filter(t => !t.done).sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"));
  const finished = data.todos.filter(t => t.done);

  const sect = document.createElement("div");
  sect.className = "sect";
  sect.innerHTML = `<span class="tick" style="background:var(--todo)"></span><h2>Offen</h2><span class="chip-badge">${open.length}</span>`;
  box.appendChild(sect);

  if (!open.length) {
    box.insertAdjacentHTML("beforeend", '<div class="empty-state">Nichts offen.<br>Neue Aufgabe über den +&#8209;Knopf.</div>');
  } else {
    box.insertAdjacentHTML("beforeend", '<div class="hint">Wischen: rechts = abhaken · links = löschen</div>');
  }
  const today = todayStr();
  open.forEach((t, i) => box.appendChild(todoRow(t, i, today)));

  if (finished.length) {
    const s2 = document.createElement("div");
    s2.className = "sect";
    s2.innerHTML = `<span class="tick" style="background:var(--faint)"></span><h2>Erledigt</h2><span class="chip-badge">${finished.length}</span>`;
    box.appendChild(s2);
    finished.forEach((t, i) => box.appendChild(todoRow(t, i, today)));
  }
}
function todoRow(t, i, today) {
  const overdue = !t.done && t.deadline && t.deadline < today;
  const row = document.createElement("div");
  row.className = "row" + (t.done ? " done" : "");
  row.style.animationDelay = (i * .03) + "s";
  const meta = [];
  if (t.deadline) {
    const pre = t.kind === "on" ? "am " : "bis ";
    meta.push((overdue ? '<span class="overdue">' : "<span>") + pre + fmtNice(t.deadline) + (overdue ? " · überfällig</span>" : "</span>"));
  }
  if (t.deadlineTime) meta.push("<span>" + t.deadlineTime + " Uhr</span>");
  row.innerHTML = `
    <button class="ring-check ${t.done ? "on" : ""}" style="${t.done ? "background:var(--todo);border-color:var(--todo)" : ""}">${t.done ? "✓" : ""}</button>
    <div class="grow"><div class="t">${esc(t.title)}</div>${meta.length ? '<div class="s">' + meta.join("") + "</div>" : ""}</div>`;
  const toggle = () => { markTodo(t, !t.done); save(); rerenderAll(); };
  row.querySelector(".ring-check").addEventListener("click", toggle);
  enableSwipe(row, {
    onRight: toggle,
    onDelete: () => { data.todos = data.todos.filter(x => x.id !== t.id); save(); rerenderAll(); }
  });
  return row;
}

    const cats = [...new Set(items.map(catOf))].sort((a, b) => a.localeCompare(b, "de"));
    const grid = document.createElement("div");
    grid.className = "tiles";
    cats.forEach((cat, i) => {
      const inCat = items.filter(b => catOf(b) === cat);

      const tile = document.createElement("button");
      tile.className = "tile";

      tile.addEventListener("click", () => { booksView = cat; renderMedia(); });
      grid.appendChild(tile);
    });

    return;
  }

  // Innerhalb einer Kategorie
  const back = document.createElement("button");
  back.className = "back-row";
  back.textContent = "← Alle Kategorien";
  back.addEventListener("click", () => { booksView = null; renderMedia(); });
  box.appendChild(back);
  box.insertAdjacentHTML("beforeend", `<div class="cat-title">${iconOf(booksView)} ${esc(booksView)}</div>`);
  box.insertAdjacentHTML("beforeend", '<div class="hint">Antippen für Details · nach links wischen = löschen</div>');

  const inCat = items.filter(x => catOf(x) === booksView).sort((a, b) => tierRank(a.tier) - tierRank(b.tier));
  inCat.forEach((b, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.style.cursor = "pointer";
    row.style.animationDelay = (i * .03) + "s";
    const preview = b.busy ? "Claude schlägt nach …"
      : (b.desc || (b.answer || "").split("\n")[0]).trim();
    row.innerHTML = `
      <div class="grow">
        <div class="t">${esc(b.question)}${engTag(b)}</div>
        ${preview ? '<div class="s"><span class="prev">' + esc(preview) + "</span></div>" : ""}
      </div>${tierBadge(b.tier)}<span style="color:var(--faint)">›</span>`;
    row.addEventListener("click", () => openMediaDetail(b));
    enableSwipe(row, {
      onDelete: () => { data.books = data.books.filter(x => x.id !== b.id); save(); renderMedia(); }
    });
    box.appendChild(row);
  });
}

function makeTierChip(b, sheet, rebuild) {
  const chip = document.createElement("span");
  chip.className = "tl-item";
  chip.textContent = shorten(b.question, 26);
  chip.title = b.question;
  chip.style.touchAction = "none";
  chip.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let ghost = null, dragging = false;
    try { chip.setPointerCapture(e.pointerId); } catch {}
    const clearOver = () => sheet.querySelectorAll("[data-tier]").forEach(r => r.classList.remove("tl-over"));
    const targetAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest("[data-tier]") : null;
    };
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        dragging = true;
        ghost = chip.cloneNode(true);
        ghost.classList.add("tl-ghost");
        document.body.appendChild(ghost);
        chip.classList.add("tl-dragging");
      }
      if (!dragging) return;
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      clearOver();
      const t = targetAt(ev.clientX, ev.clientY);
      if (t) t.classList.add("tl-over");
    };
    const up = ev => {
      chip.removeEventListener("pointermove", move);
      chip.removeEventListener("pointerup", up);
      chip.removeEventListener("pointercancel", up);
      if (ghost) ghost.remove();
      chip.classList.remove("tl-dragging");
      clearOver();
      if (!dragging) return;
      const t = targetAt(ev.clientX, ev.clientY);
      if (t) {
        b.tier = t.dataset.tier || "";
        save(); renderMedia(); rebuild();
      }
    };
    chip.addEventListener("pointermove", move);
    chip.addEventListener("pointerup", up);
    chip.addEventListener("pointercancel", up);
  });
  return chip;
}

/* ---- Claude räumt auf: Titel korrigieren, Urheber anhängen, Genre, ein Satz ---- */
function jsonFrom(text) {
  const t = String(text).replace(/```json|```/g, "").trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  const c = t.indexOf("["), d = t.lastIndexOf("]");
  if (c >= 0 && d > c) { try { return JSON.parse(t.slice(c, d + 1)); } catch {} }
  return null;
}
function enrichSystem(cfg, eng) {
  const lang = eng
    ? "Der Nutzer liest auf ENGLISCH: gib den englischen Originaltitel, nicht die deutsche Ausgabe. "
    : "Gib die offizielle deutsche Fassung des Titels (falls es keine gibt, den Originaltitel). ";
  return "Du bist ein sorgfältiger Katalog für " + cfg.things + ". " + lang
    + "Der Nutzer tippt Titel oft falsch, unvollständig oder klein geschrieben. "
    + "Erkenne, welches " + cfg.thing + " gemeint ist, und korrigiere die Schreibweise. "
    + "Hänge hinten mit „ – “ den " + cfg.who + " an, z.B. „… – " + cfg.whoEx + "“. "
    + "Antworte AUSSCHLIESSLICH mit JSON, ohne Code-Fences, im Format: "
    + '{"title":"<Titel> – <' + cfg.who + '>","cat":"<Kategorie>","desc":"<genau ein Satz>"}. '
    + "cat ist genau eine dieser Kategorien: " + cfg.cats.join(", ") + ". "
    + "desc ist EIN einziger Satz auf Deutsch (max. 20 Wörter): worum es geht bzw. die Kernaussage. Keine Spoiler zum Ende. "
    + "Wenn du den Titel nicht sicher erkennst, gib ihn unverändert zurück und setze desc auf \"\".";
}
function applyEnrich(b, o, cfg) {
  if (!o || typeof o !== "object") return false;
  if (typeof o.title === "string" && o.title.trim()) b.question = o.title.trim();
  if (typeof o.cat === "string" && cfg.cats.includes(o.cat.trim()) && (b.autoCat || !b.cat)) b.cat = o.cat.trim();
  if (typeof o.desc === "string" && o.desc.trim()) b.desc = o.desc.trim();
  b.enriched = true;
  return true;
}

// Einzelner Eintrag – läuft still im Hintergrund nach dem Hinzufügen
async function enrichMedia(b) {
  const cfg = MEDIA[b.media] || MEDIA.book;
  if (!getApiKey()) return;
  b.busy = true; renderMedia();
  try {
    const r = await callClaude({
      system: enrichSystem(cfg, b.eng),
      userText: b.question,
      maxTokens: 220
    });
    if (r) {
      applyEnrich(b, jsonFrom(r.text), cfg);
      b.cost = (b.cost || 0) + r.cost;
    }
  } catch {
    // still bleiben – der Eintrag steht ja schon
  } finally {
    delete b.busy;
    save(); renderMedia();
  }
}

// Sammel-Knopf: alle Einträge ohne Autor/Beschreibung in einem Aufruf nachtragen
function needsEnrich(b) { return !b.enriched || !b.desc; }
async function enrichAllMissing(btn) {
  const cfg = M();
  const todo = itemsOfMedia().filter(needsEnrich);
  if (!todo.length) { alert("Alles schon vollständig."); return; }
  if (!getApiKey()) { alert("Dafür brauchst du deinen API-Schlüssel in den Einstellungen."); return; }
  const label = btn.textContent;
  btn.disabled = true;
  try {
    // in Portionen, damit die Antwort nicht abgeschnitten wird
    const CHUNK = 12;
    for (let i = 0; i < todo.length; i += CHUNK) {
      const part = todo.slice(i, i + CHUNK);
      btn.textContent = "Claude arbeitet … " + Math.min(i + CHUNK, todo.length) + "/" + todo.length;
      const list = part.map((b, n) => (n + 1) + ". " + b.question).join("\n");
      const r = await callClaude({
        system: enrichSystem(cfg, part[0] && part[0].eng).replace(
          'Antworte AUSSCHLIESSLICH mit JSON, ohne Code-Fences, im Format: {"title"',
          'Du bekommst eine nummerierte Liste. Antworte AUSSCHLIESSLICH mit einem JSON-Array in genau dieser Reihenfolge und Länge, ohne Code-Fences, Elemente im Format: {"title"'
        ),
        userText: list,
        maxTokens: 180 * part.length + 200
      });
      if (!r) break;
      const arr = jsonFrom(r.text);
      if (Array.isArray(arr)) part.forEach((b, n) => applyEnrich(b, arr[n], cfg));
      save(); renderMedia();
    }
    alert("Fertig – " + todo.length + " " + (todo.length === 1 ? cfg.one : cfg.many) + " nachgetragen.");
  } catch (err) {
    alert("Das hat nicht geklappt: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
    save(); renderMedia();
  }
}

/* „englisch" aus der Eingabe ziehen – das Wort selbst fliegt aus dem Titel */
function parseEnglish(input) {
  const m = String(input).match(/\s*\b(auf\s+)?(englisch|english|eng)\b\s*$/i);
  if (!m) return { text: String(input).trim(), eng: false };
  return { text: String(input).slice(0, m.index).trim(), eng: true };
}

/* ---- Ganze Reihe: „Der Herr der Ringe 1-“ oder „… 1-3“ ---- */
function parseSeries(input) {
  const m = String(input).match(/^(.*?[^\d\s])\s*(\d+)\s*-\s*(\d+)?\s*$/);
  if (!m) return null;
  const from = parseInt(m[2], 10);
  const to = m[3] ? parseInt(m[3], 10) : null;
  if (!from || (to && to < from)) return null;
  return { base: m[1].trim(), from, to };
}

async function askSeries(base, from, to, cfg, eng) {
  const range = to ? ("Band " + from + " bis " + to) : ("ab Band " + from + " alle erschienenen Bände");
  const r = await callClaude({
    system: "Du bist ein sorgfältiger Katalog für " + cfg.things + ". Der Nutzer nennt eine Reihe, oft falsch geschrieben. "
      + "Erkenne die Reihe und liste die einzelnen Bände in Erscheinungsreihenfolge auf. "
      + (eng ? "Die Titel in der englischen Originalfassung. " : "Jeder Titel offiziell deutsch geschrieben. ")
      + "Hinten mit „ – “ den " + cfg.who + " angehängt. "
      + "Antworte AUSSCHLIESSLICH mit JSON, ohne Code-Fences: "
      + '{"series":"<Reihenname>","items":[{"title":"<Bandtitel> – <' + cfg.who + '>","cat":"<Kategorie>","desc":"<genau ein Satz, max. 20 Wörter>"}]}. '
      + "cat ist genau eine dieser Kategorien: " + cfg.cats.join(", ") + ". "
      + "Höchstens 20 Einträge. Wenn du keine Reihe erkennst, gib \"items\": [] zurück.",
    userText: "Reihe: " + base + "\nGewünscht: " + range,
    maxTokens: 2000
  });
  if (!r) return null;
  const o = jsonFrom(r.text);
  if (!o || !Array.isArray(o.items) || !o.items.length) return null;
  return o;
}

      + ". Berücksichtige die Wertungen stark: empfiehl vor allem Ähnliches zu S- und A-Titeln und meide Ähnliches zu C- und D-Titeln. " + cfg.tipsAsk;

function tipsCardsHtml(tips) {
  const lines = tips.text.split("\n").map(l => l.trim()).filter(Boolean);
  return lines.map((line, i) => {
    const clean = line.replace(/^\s*\d+[.)]\s*/, "");
    const parts = clean.split("|").map(s => s.trim());
    return `<div class="tip-card">
      <div class="tt">${i + 1}. ${esc(parts[0] || clean)}</div>
      ${parts[1] ? '<div class="ta">' + esc(parts[1]) + "</div>" : ""}
      ${parts[2] ? '<div class="tr">' + esc(parts.slice(2).join(" – ")) + "</div>" : ""}
    </div>`;
  }).join("");
}

/* ================================================================
   VOKABELN — englische Wörter beim Lesen sammeln und wiederholen
   ================================================================ */
let vocabFilter = "";   // "" = alle, sonst Buchtitel

function vocabDue() {
  const t = todayStr();
  return data.vocab.filter(v => (v.due || t) <= t);
}
function bookTitlesWithVocab() {
  return [...new Set(data.vocab.map(v => v.book).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
}

async function lookupWord(word, sentence, book) {
  return callClaude({
    system: "Du hilfst einem deutschen Leser bei einem Wort aus seiner Lektüre. "
      + "Entscheide selbst, was gebraucht wird:\n"
      + "· Fremdsprachiges Wort (meist Englisch) → übersetzen. kind = \"word\".\n"
      + "· Deutscher Fachbegriff aus Philosophie, Wissenschaft o.ä. → in normalem Deutsch erklären, NICHT übersetzen. "
      + "trans ist dann eine kurze Umschreibung in zwei bis vier Wörtern. kind = \"term\".\n"
      + "Korrigiere Tippfehler und gib die Grundform an. "
      + "Antworte AUSSCHLIESSLICH mit JSON, ohne Code-Fences: "
      + '{"word":"<Wort, Grundform>","kind":"word"|"term","type":"<Wortart auf Deutsch>","trans":"<Übersetzung bzw. kurze Umschreibung>","meaning":"<ein bis zwei kurze deutsche Sätze: was es bedeutet>","example":"<ein kurzer Beispielsatz>"}. '
      + "Wenn ein Satz mitgeliefert wird, beziehe dich auf DIESE Bedeutung im Satz, nicht auf die häufigste."
      + (book ? " Der Begriff stammt aus „" + book + "“ – erkläre ihn so, wie dieser Autor ihn verwendet." : ""),
    userText: sentence ? word + "\n\nIm Satz: " + sentence : word,
    maxTokens: 300
  });
}
function applyWord(v, o) {
  if (!o) return;
  if (o.word) v.word = String(o.word).trim();
  v.kind = o.kind === "term" ? "term" : "word";
  v.trans = String(o.trans || "").trim();
  v.type = String(o.type || "").trim();
  v.meaning = String(o.meaning || "").trim();
  v.example = String(o.example || "").trim();
}
function kindTag(v) {
  return v.kind === "term"
    ? '<span class="k-tag k-de">Fachbegriff</span>'
    : '<span class="k-tag k-eng">Englisch</span>';
}

function renderVocab() {
  const box = $("media-body");
  box.innerHTML = "";
  const all = data.vocab;
  const due = vocabDue();

  if (!all.length) {
    box.innerHTML = '<div class="empty-state">Noch keine Vokabeln.<br>Beim Lesen ein unbekanntes Wort über + eintragen – Claude erklärt es dir.</div>';
    return;
  }

  const learned = all.filter(v => v.box >= VOCAB_BOXES.length).length;
  box.insertAdjacentHTML("beforeend", `
    <div class="stat-grid">
      <div class="stat"><div class="v">${all.length}</div><div class="l">Wörter</div></div>
      <div class="stat"><div class="v" style="color:${due.length ? "var(--media)" : "var(--muted)"}">${due.length}</div><div class="l">fällig</div></div>
      <div class="stat"><div class="v" style="color:var(--todo)">${learned}</div><div class="l">sitzen</div></div>
    </div>
    ${btnHTML("primary", "vc-quiz", "play",
      due.length ? "Abfrage · " + due.length + " fällig" : "Heute nichts fällig",
      { accent: "var(--media)", disabled: !due.length })}`);
  if (due.length) $("vc-quiz").addEventListener("click", () => startQuiz(due));

  // Filter nach Buch
  const books = bookTitlesWithVocab();
  if (books.length > 1 || (books.length === 1 && all.some(v => !v.book))) {
    const f = document.createElement("div");
    f.className = "vc-filter";
    const chips = [["", "Alle"]].concat(books.map(b => [b, b.split(" – ")[0]]));
    if (all.some(v => !v.book)) chips.push(["__none", "Ohne Buch"]);
    f.innerHTML = chips.map(([k, l]) =>
      `<button class="vc-chip ${vocabFilter === k ? "on" : ""}" data-f="${esc(k)}">${esc(l)}</button>`).join("");
    f.querySelectorAll(".vc-chip").forEach(c => c.addEventListener("click", () => {
      vocabFilter = c.dataset.f; renderVocab();
    }));
    box.appendChild(f);
  }

  let list = all;
  if (vocabFilter === "__none") list = all.filter(v => !v.book);
  else if (vocabFilter) list = all.filter(v => v.book === vocabFilter);
  list = [...list].sort((a, b) => (b.created || 0) - (a.created || 0));

  box.insertAdjacentHTML("beforeend", '<div class="hint">Antippen für Details · nach links wischen = löschen</div>');
  const today = todayStr();
  list.forEach((v, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.style.cursor = "pointer";
    row.style.animationDelay = (i * .03) + "s";
    const ripe = (v.due || today) <= today;
    row.innerHTML = `
      <div class="grow">
        <div class="vc-word">${esc(v.word)}</div>
        <div class="vc-trans">${v.busy ? "Claude schlägt nach …" : esc(v.trans || "")}</div>
      </div>
      <span class="vc-box ${ripe ? "ripe" : ""}" title="Fach ${v.box}">${v.box}</span>
      <span style="color:var(--faint)">›</span>`;
    row.addEventListener("click", () => openVocabDetail(v));
    enableSwipe(row, {
      onDelete: () => { data.vocab = data.vocab.filter(x => x.id !== v.id); save(); renderVocab(); }
    });
    box.appendChild(row);
  });
}

function openVocabSheet() {
  // Laufende Bücher zuerst, das zuletzt benutzte vorausgewählt
  const reading = data.books.filter(b => b.reading);
  const last = data.vocab.length ? data.vocab[data.vocab.length - 1].book : "";
  let picked = reading.some(b => b.question === last) ? last : (reading[0] ? reading[0].question : "");
  const chips = reading.map(b =>
    `<span class="vc-chip ${b.question === picked ? "on" : ""}" data-book="${esc(b.question)}">${esc(shorten(b.question, 20))}</span>`).join("")
    + `<span class="vc-chip ${picked ? "" : "on"}" data-book="">Kein Buch</span>`;

  const { sheet, close } = openSheet(`
    <h3>Neues Wort</h3>
    <div class="sub">Englische Wörter werden übersetzt, deutsche Fachbegriffe erklärt.</div>
    <input type="text" id="vc-word" placeholder="z.B. reluctant oder Apperzeption" autocomplete="off" autocapitalize="none" spellcheck="false">
    <label>Satz aus dem Buch (optional)</label>
    <textarea id="vc-sent" placeholder="„She was reluctant to leave the house.“" style="min-height:80px"></textarea>
    <div class="hint" style="margin-top:8px">Lohnt sich bei Wörtern mit mehreren Bedeutungen.</div>
    <label>Buch</label>
    <div class="vc-filter" id="vc-books">${chips}</div>
    <div class="sheet-actions">
      <button class="quiet" data-act="cancel">Abbrechen</button>
      <button class="primary" data-act="save">Nachschlagen</button>
    </div>`, { accent: "var(--media)" });

  sheet.querySelectorAll("#vc-books .vc-chip").forEach(c => c.addEventListener("click", () => {
    picked = c.dataset.book;
    sheet.querySelectorAll("#vc-books .vc-chip").forEach(x => x.classList.toggle("on", x === c));
  }));

  sheet.querySelector('[data-act="cancel"]').addEventListener("click", close);
  sheet.querySelector('[data-act="save"]').addEventListener("click", async ev => {
    const word = sheet.querySelector("#vc-word").value.trim();
    if (!word) return;
    const sentence = sheet.querySelector("#vc-sent").value.trim();
    const book = picked;
    const v = {
      id: uid(), word, sentence, book, kind: "word",
      trans: "", type: "", meaning: "", example: "",

    };
    data.vocab.push(v);
    save(); close(); renderVocab();

    } finally {
      delete v.busy;
      save(); renderVocab();

/* ---- Abfrage ---- */
function startQuiz(words) {
  let queue = [...words].sort(() => Math.random() - 0.5);
  const total = queue.length;
  let done = 0, right = 0, i = 0;

  const el = document.createElement("div");
  el.className = "quiz";
  el.innerHTML = `
    <div class="quiz-top">
      <span class="quiz-count" id="q-count"></span>
      <button class="sheet-x" style="position:static" id="q-close">✕</button>
    </div>
    <div class="quiz-bar"><span id="q-bar" style="width:0%"></span></div>
    <div class="quiz-mid">
      <div class="quiz-w" id="q-word"></div>
      <div class="quiz-src" id="q-src"></div>
      <div class="quiz-a" id="q-answer"></div>
    </div>
    <div class="quiz-btns" id="q-btns"></div>`;
  document.body.appendChild(el);

  const close = () => { el.remove(); renderVocab(); rerenderAll(); };
  $("q-close").addEventListener("click", close);

  const show = () => {
    if (!queue.length) { finish(); return; }
    const v = queue[0];
    el.classList.remove("open");
    $("q-count").textContent = done + " von " + total;
    $("q-bar").style.width = (total ? done / total * 100 : 0) + "%";
    $("q-word").textContent = v.word;
    $("q-src").textContent = v.book ? v.book.split(" – ")[0] : "";
    $("q-answer").innerHTML = `
      <div class="quiz-t">${esc(v.trans || "–")}</div>
      ${v.meaning ? '<div class="quiz-m">' + esc(v.meaning) + "</div>" : ""}
      ${v.example ? '<div class="quiz-e">„' + esc(v.example) + "“</div>" : ""}`;
    $("q-btns").innerHTML = '<button class="quiz-reveal" id="q-reveal">Aufdecken</button>';
    $("q-reveal").addEventListener("click", () => {
      el.classList.add("open");
      $("q-btns").innerHTML = '<button class="quiz-again" id="q-again">Nochmal</button><button class="quiz-got" id="q-got">Gewusst</button>';
      $("q-again").addEventListener("click", () => grade(false));
      $("q-got").addEventListener("click", () => grade(true));
    });
  };

  const grade = ok => {
    const v = queue.shift();
    const firstTry = !v.__retried;
    if (ok) {
      v.box = Math.min(VOCAB_BOXES.length, (v.box || 1) + 1);
      v.due = addDaysIso(todayStr(), VOCAB_BOXES[v.box - 1]);
      if (firstTry) right++;      // nur beim ersten Anlauf zählt es als gewusst
      done++;
    } else {
      v.box = 1;
      v.due = todayStr();
      if (firstTry) { v.__retried = true; queue.push(v); }  // in dieser Runde nochmal
      else done++;
    }
    save();
    show();
  };

  const finish = () => {
    data.vocab.forEach(v => { delete v.__retried; });
    save();
    el.classList.remove("open");
    $("q-count").textContent = "fertig";
    $("q-bar").style.width = "100%";
    el.querySelector(".quiz-mid").innerHTML = `
      <div class="quiz-done">
        <div class="qd-big">${right} von ${total}</div>
        <div class="quiz-m">${right === total ? "Alles gesessen. Stark." : right === 0 ? "Kommt wieder. Öfter ist besser als länger." : "Der Rest kommt bald nochmal."}</div>
      </div>`;
    $("q-btns").innerHTML = '<button class="quiz-got" id="q-fin">Fertig</button>';
    $("q-fin").addEventListener("click", close);
  };

  show();
}

function allEx() {

}
function isCustomEx(name) { return data.sport.customEx.some(e => e.name === name); }
let sportWeek = 0;   // 0 = diese Woche, -1 = vorige …
