<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gewohnheiten</title>
<meta name="description" content="Kleine Wenn-dann-Pläne, ein Tipp am Tag.">
<link rel="manifest" href="gewohnheiten.webmanifest">
<link rel="apple-touch-icon" href="apple-gewohnheiten.png">
<link rel="icon" type="image/png" href="icon-gewohnheiten.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gewohnheiten">
<link rel="stylesheet" href="tw.css">
<style>
  :root { --accent: #30b158; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #32d65f; --on-accent: #000000; } }
  :root[data-theme="dark"] { --accent: #32d65f; --on-accent: #000000; }
  .h-line { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .h-nudge { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .new-btn { margin-top: 20px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
  .grid .wd { font-size: 11px; color: var(--muted); text-align: center; font-weight: 700; }
  .grid button { aspect-ratio: 1; border-radius: 50%; background: var(--soft); font-size: 12px; color: var(--muted); display: grid; place-items: center; }
  .grid button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .grid button.today { box-shadow: 0 0 0 2px var(--fg) inset; }
  .grid button.future, .grid button.before { opacity: .25; pointer-events: none; }
  .tpl { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="tw-head">
    <div>
      <h1>Gewohnheiten</h1>
      <p class="tw-sub" id="sub"></p>
    </div>
    <button class="tw-icon-btn" id="menu" aria-label="Menü"></button>
  </header>
  <div id="notes"></div>
  <ul class="tw-list" id="list"></ul>
  <div id="after"></div>
</div>
<script src="tw.js"></script>
<script src="gewohnheiten.js"></script>
</body>
</html>
